<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year Countdown Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ============================================================
     EDIT HERE
     Quote  : change the text after 'YOUR QUOTE' in the <script>
              below (or pass ?msg=Hello in the URL).
     Accent : change --figure below (or pass ?accent=%23ff5500).
     Calendar: pass ?k=<WALLPAPER_KEY> and the week is read from the
              personal dashboard (/api/wallpaper/week). No key -> empty week.

     Rendered at a real iPhone 13 viewport (390x844 pt @3x = 1170x2532).
     Top to bottom: iOS clock + date (kept clear), the QUOTE, this
     week's calendar, then the year countdown (status, 365-dot grid,
     caption). Bottom strip kept clear for the flashlight/camera buttons.
     ============================================================ */
  :root{
    --bg:#000000;
    --label:#fcfaf6;                     /* the quote */
    --figure:#f7b54e;                    /* days-left + percent numbers, today dot */
    --support:#d3cdc1;                   /* status + caption words (~13:1 on black) */
    --fill-past:rgba(247,181,78,0.46);   /* elapsed — warm */
    --fill-future:rgba(255,255,255,0.15);/* remaining — cool, still visible */
    --card:rgba(255,255,255,0.06);
    --font:"Inter",-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);height:100%}
  body{
    display:grid;place-items:center;
    font-family:var(--font);color:var(--label);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* Phone-shaped canvas: fills a portrait phone screen exactly,
     letterboxes on a desktop preview. iPhone 13 = 1170x2532. */
  .frame{
    width:min(100vw, calc(100vh * 1170 / 2532));
    height:min(100vh, calc(100vw * 2532 / 1170));
    background:var(--bg);
    container-type:size;
    display:flex;flex-direction:column;align-items:center;
    padding:0 4cqw;
  }

  /* Status bar + clock + date live here. */
  .safe-top{flex:0 0 27cqh}

  .quote{
    max-width:84cqw;
    font-size:6.6cqw;font-weight:600;line-height:1.14;letter-spacing:-0.018em;
    text-align:center;text-wrap:balance;color:var(--label);
  }

  /* ---------- this week ---------- */
  .week{
    margin-top:3cqh;width:100%;
    display:grid;grid-template-columns:repeat(7,1fr);gap:0.6cqw;
    padding:1.2cqw;border-radius:3.6cqw;background:var(--card);
    height:28cqh;overflow:hidden;align-items:start;
  }
  .day{min-width:0;display:flex;flex-direction:column;gap:0.8cqw;padding:1cqw 0.4cqw;border-radius:2.4cqw}
  .day.today{background:rgba(255,255,255,0.14)}
  .day h3{text-align:center;font-weight:500;font-size:2.8cqw;color:var(--support);line-height:1.2}
  .day h3 b{display:block;font-size:4.4cqw;font-weight:700;color:var(--label)}
  .ev{
    border-radius:1.3cqw;padding:0.7cqw 0.8cqw;
    background:color-mix(in srgb, var(--c) 62%, #000);
    font-size:2.25cqw;line-height:1.25;color:#fff;
  }
  .ev span,.ev p{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev span{font-size:1.8cqw;opacity:0.85;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
  .ev p{font-weight:600}
  .more{text-align:center;font-size:2.3cqw;color:var(--support)}
  .week-note{grid-column:1/-1;text-align:center;font-size:2.8cqw;color:var(--support);padding-top:1cqh}

  /* ---------- year countdown: status sits directly on top of the grid ---------- */
  .stats{margin-top:3.4cqh;display:flex;flex-direction:column;align-items:center;width:100%}
  .status{
    font-size:4.6cqw;font-weight:500;line-height:1.2;
    color:var(--support);letter-spacing:-0.005em;
  }
  .status b{font-weight:700;color:var(--figure)}

  .grid{
    margin-top:1.6cqh;
    display:grid;grid-template-columns:repeat(37,1fr);
    gap:0.55cqw;width:84cqw;
  }
  .dot{width:100%;aspect-ratio:1;border-radius:50%;background:var(--fill-future)}
  .dot.past{background:var(--fill-past)}
  .dot.today{
    background:var(--figure);
    box-shadow:0 0 0 0.45cqw rgba(247,181,78,0.30),
               0 0 1.3cqw rgba(247,181,78,0.55);
  }

  .meta{
    margin-top:1.6cqh;
    font-size:3.3cqw;font-weight:500;color:var(--support);
    font-variant-numeric:tabular-nums;
  }
  .meta b{font-weight:700;color:var(--figure)}
</style>
</head>
<body>
  <div class="frame">
    <div class="safe-top"></div>
    <p class="quote" id="msg">Do the hard things, especially when you don&rsquo;t want to</p>
    <div class="week" id="week" aria-label="This week"></div>
    <div class="stats">
      <p class="status" id="status">&mdash;</p>
      <div class="grid" id="grid" role="img" aria-label="Year progress"></div>
      <p class="meta" id="meta"></p>
    </div>
  </div>

<script>
  (function(){
    var params = new URLSearchParams(location.search);
    var DASHBOARD = 'https://personal-dashboard-liard-five.vercel.app';
    var MAX_EVENTS = 6; // per day; the rest collapse into "+n"

    /* ---- YOUR QUOTE (edit the text in quotes) ---- */
    var MESSAGE = params.get('msg') || "Do the hard things, especially when you don’t want to";

    var accent = params.get('accent');
    if (accent) document.documentElement.style.setProperty('--figure', accent);

    // Date: prefer an explicit ?date=YYYY-MM-DD (the Shortcut passes the
    // phone's local date), otherwise fall back to this machine's clock.
    var now;
    var dp = params.get('date');
    if (dp && /^\d{4}-\d{2}-\d{2}$/.test(dp)){
      var p = dp.split('-');
      now = new Date(+p[0], +p[1]-1, +p[2], 12, 0, 0);
    } else {
      now = new Date();
    }

    var year = now.getFullYear();
    var startOfYear = new Date(year, 0, 1);
    var isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
    var totalDays = isLeap ? 366 : 365;
    var dayOfYear = Math.floor((now - startOfYear) / 86400000) + 1;
    var daysLeft = totalDays - dayOfYear;
    var pctDone = Math.round((dayOfYear / totalDays) * 100);

    var dateStr = now.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'});

    document.getElementById('msg').textContent = MESSAGE;
    document.getElementById('status').innerHTML =
      '<b>' + daysLeft + '</b> ' + (daysLeft === 1 ? 'day' : 'days') + ' left in ' + year;
    document.getElementById('meta').innerHTML =
      '<b>' + pctDone + '%</b> of ' + year + ' · ' + dateStr;

    var grid = document.getElementById('grid');
    grid.setAttribute('aria-label',
      dayOfYear + ' of ' + totalDays + ' days of ' + year + ' elapsed');
    var frag = document.createDocumentFragment();
    for (var i = 1; i <= totalDays; i++){
      var d = document.createElement('span');
      d.className = 'dot' + (i < dayOfYear ? ' past' : i === dayOfYear ? ' today' : '');
      frag.appendChild(d);
    }
    grid.appendChild(frag);

    /* ---- this week (Mon..Sun) ---- */
    var LABELS = ['T2','T3','T4','T5','T6','T7','CN'];
    var monday = new Date(now);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    function key(dt){
      return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
    }
    var todayKey = key(now);

    function el(tag, cls, text){
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function renderWeek(days, note){
      var week = document.getElementById('week');
      week.textContent = '';
      for (var i = 0; i < 7; i++){
        var dt = new Date(monday); dt.setDate(monday.getDate() + i);
        var k = key(dt);
        var col = el('div', 'day' + (k === todayKey ? ' today' : ''));
        var h = el('h3', null, LABELS[i]);
        h.appendChild(el('b', null, String(dt.getDate())));
        col.appendChild(h);
        var evs = (days && days[k]) || [];
        evs.slice(0, MAX_EVENTS).forEach(function(e){
          var chip = el('div', 'ev');
          chip.style.setProperty('--c', e.color || '#4285f4');
          if (!e.allDay) chip.appendChild(el('span', null, e.start + '–' + e.end));
          chip.appendChild(el('p', null, e.title)); // textContent: titles never parsed as HTML
          col.appendChild(chip);
        });
        if (evs.length > MAX_EVENTS) col.appendChild(el('p', 'more', '+' + (evs.length - MAX_EVENTS)));
        week.appendChild(col);
      }
      if (note) week.appendChild(el('p', 'week-note', note));
      document.body.dataset.ready = '1'; // the screenshot service waits for this
    }

    var k = params.get('k');
    if (!k){ renderWeek(null); return; }

    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 8000);
    fetch(DASHBOARD + '/api/wallpaper/week?key=' + encodeURIComponent(k) + '&date=' + todayKey, {signal: ctrl.signal})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        var byDay = {};
        data.days.forEach(function(d){ byDay[d.day] = d.events; });
        renderWeek(byDay);
      })
      .catch(function(){ renderWeek(null, 'Không tải được lịch'); })
      .finally(function(){ clearTimeout(timer); });
  })();
</script>
</body>
</html>
