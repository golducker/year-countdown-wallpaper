<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year Countdown Wallpaper</title>
<style>
  /* ============================================================
     EDIT HERE
     Message : change the text after 'YOUR MESSAGE' in the <script>
               below (or pass ?msg=Hello in the URL).
     Accent  : change --accent below (or pass ?accent=%23ff5500).

     Layout reviewed against Apple HIG. iPhone 13, 1170x2532 (390x844 pt).
     Hierarchy: the MESSAGE is the primary element; the day count is a
     supporting stat; the dot grid is a quiet baseline.
     Top 41% is left clear for the iOS clock, date, and the below-clock
     widget tray (Weather + Google Calendar).
     ============================================================ */
  :root{
    --bg:#000000;
    --accent:#f5b24b;                          /* reserved: TODAY dot only  */
    --label:#ffffff;                           /* primary — the message      */
    --label-strong:rgba(235,235,245,0.85);     /* the day count              */
    --label-secondary:rgba(235,235,245,0.60);  /* labels, date, percentage   */
    --fill-past:rgba(255,255,255,0.18);
    --fill-future:rgba(255,255,255,0.05);
    --font:-apple-system,"SF Pro Display","SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);height:100%}
  body{
    display:grid;place-items:center;
    font-family:var(--font);color:var(--label);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
  }

  /* Phone-shaped canvas: fills a portrait phone screen exactly,
     letterboxes on a desktop preview. iPhone 13 = 1170x2532. */
  .frame{
    width:min(100vw, calc(100vh * 1170 / 2532));
    height:min(100vh, calc(100vw * 2532 / 1170));
    background:var(--bg);
    container-type:size;
    display:flex;flex-direction:column;
    padding:0 8cqw;
  }

  /* Status bar + clock + date + the below-clock widget tray live here. */
  .safe-top{flex:0 0 41cqh}

  .stack{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:2.5cqh 0 8cqh;
  }

  /* --- primary block: message + supporting count, held high --- */
  .top{display:flex;flex-direction:column;align-items:center;gap:3cqh}
  .message{
    font-size:8cqw;font-weight:600;line-height:1.15;letter-spacing:-0.01em;
    text-align:center;text-wrap:balance;color:var(--label);max-width:82cqw;
  }
  .countdown{display:flex;flex-direction:column;align-items:center;gap:0.6cqw}
  .countdown .n{
    font-size:6cqw;font-weight:600;line-height:1;letter-spacing:-0.02em;
    color:var(--label-strong);font-variant-numeric:tabular-nums;
  }
  .countdown .l{font-size:2.9cqw;font-weight:400;color:var(--label-secondary)}

  /* --- baseline block: quiet year-progress grid + one caption --- */
  .bottom{display:flex;flex-direction:column;align-items:center;gap:2.4cqw}
  .grid{display:grid;grid-template-columns:repeat(21,1fr);gap:0.9cqw;width:58cqw}
  .dot{width:100%;aspect-ratio:1;border-radius:50%;background:var(--fill-future)}
  .dot.past{background:var(--fill-past)}
  .dot.today{
    background:var(--accent);
    box-shadow:0 0 0 0.7cqw rgba(245,178,75,0.22),
               0 0 1.4cqw rgba(245,178,75,0.40);
  }
  .meta{
    font-size:2.9cqw;font-weight:400;color:var(--label-secondary);
    font-variant-numeric:tabular-nums;letter-spacing:0.01em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="safe-top"></div>
    <div class="stack">
      <div class="top">
        <p class="message" id="msg">Do the hard things, especially when you don&rsquo;t want to</p>
        <div class="countdown">
          <span class="n" id="num">—</span>
          <span class="l" id="sub">days left</span>
        </div>
      </div>
      <div class="bottom">
        <div class="grid" id="grid" role="img" aria-label="Year progress"></div>
        <span class="meta" id="meta"></span>
      </div>
    </div>
  </div>

<script>
  (function(){
    var params = new URLSearchParams(location.search);

    /* ---- YOUR MESSAGE (edit the text in quotes) ---- */
    var MESSAGE = params.get('msg') || "Do the hard things, especially when you don’t want to";

    var accent = params.get('accent');
    if (accent) document.documentElement.style.setProperty('--accent', accent);

    var now;
    var dp = params.get('date');
    if (dp && /^\d{4}-\d{2}-\d{2}$/.test(dp)){
      var p = dp.split('-');
      now = new Date(+p[0], +p[1]-1, +p[2], 12, 0, 0);
    } else {
      now = new Date();
    }

    var year = now.getFullYear();
    var startOfYear = new Date(year, 0, 1);
    var isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
    var totalDays = isLeap ? 366 : 365;
    var dayOfYear = Math.floor((now - startOfYear) / 86400000) + 1;
    var daysLeft = totalDays - dayOfYear;
    var pctDone = Math.round((dayOfYear / totalDays) * 100);

    var dateStr = now.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'});

    document.getElementById('msg').textContent = MESSAGE;
    document.getElementById('num').textContent = daysLeft;
    document.getElementById('sub').textContent =
      (daysLeft === 1 ? 'day' : 'days') + ' left in ' + year;
    document.getElementById('meta').textContent =
      pctDone + '% of ' + year + ' · ' + dateStr;

    var grid = document.getElementById('grid');
    grid.setAttribute('aria-label',
      dayOfYear + ' of ' + totalDays + ' days of ' + year + ' elapsed');
    var frag = document.createDocumentFragment();
    for (var i = 1; i <= totalDays; i++){
      var d = document.createElement('span');
      d.className = 'dot' + (i < dayOfYear ? ' past' : i === dayOfYear ? ' today' : '');
      frag.appendChild(d);
    }
    grid.appendChild(frag);
  })();
</script>
</body>
</html>
