<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year Countdown Wallpaper</title>
<style>
  /* ============================================================
     EDIT HERE
     Quote  : change the text after 'YOUR QUOTE' in the <script>
              below (or pass ?msg=Hello in the URL).
     Accent : change --accent below (or pass ?accent=%23ff5500).

     Layout reviewed against Apple HIG. iPhone 13, 1170x2532 (390x844 pt).
     Hierarchy: the QUOTE is the hero — largest, pure white, centred in
     the free space. A small day-count sits above it as an eyebrow; the
     dot grid + one caption form a quiet baseline.
     Top 41% is left clear for the iOS clock, date, and the below-clock
     widget tray (Weather + Google Calendar).
     ============================================================ */
  :root{
    --bg:#000000;
    --accent:#f5b24b;                          /* reserved: TODAY dot only   */
    --label:#ffffff;                           /* the quote — nothing else    */
    --label-strong:rgba(235,235,245,0.85);     /* emphasised figures          */
    --label-secondary:rgba(235,235,245,0.60);  /* eyebrow, caption            */
    --fill-past:rgba(255,255,255,0.16);
    --fill-future:rgba(255,255,255,0.045);
    --font:-apple-system,"SF Pro Display","SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);height:100%}
  body{
    display:grid;place-items:center;
    font-family:var(--font);color:var(--label);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
  }

  /* Phone-shaped canvas: fills a portrait phone screen exactly,
     letterboxes on a desktop preview. iPhone 13 = 1170x2532. */
  .frame{
    width:min(100vw, calc(100vh * 1170 / 2532));
    height:min(100vh, calc(100vw * 2532 / 1170));
    background:var(--bg);
    container-type:size;
    display:flex;flex-direction:column;
    padding:0 8cqw;
  }

  /* Status bar + clock + date + the below-clock widget tray live here. */
  .safe-top{flex:0 0 41cqh}

  .stack{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:2.5cqh 0 10.5cqh;
  }

  /* eyebrow — small day count, sits under the widgets */
  .eyebrow{
    font-size:3cqw;font-weight:400;color:var(--label-secondary);
    letter-spacing:0.01em;text-align:center;
  }
  .eyebrow b{font-weight:600;color:var(--label-strong)}

  /* hero — the quote, centred in the free space */
  .quote{
    align-self:center;max-width:84cqw;
    font-size:9cqw;font-weight:600;line-height:1.12;letter-spacing:-0.015em;
    text-align:center;text-wrap:balance;color:var(--label);
  }

  /* baseline — quiet year-progress grid + one caption */
  .bottom{display:flex;flex-direction:column;align-items:center;gap:2.4cqw}
  .grid{display:grid;grid-template-columns:repeat(21,1fr);gap:0.85cqw;width:54cqw}
  .dot{width:100%;aspect-ratio:1;border-radius:50%;background:var(--fill-future)}
  .dot.past{background:var(--fill-past)}
  .dot.today{
    background:var(--accent);
    box-shadow:0 0 0 0.65cqw rgba(245,178,75,0.22),
               0 0 1.3cqw rgba(245,178,75,0.40);
  }
  .meta{
    font-size:2.9cqw;font-weight:400;color:var(--label-secondary);
    font-variant-numeric:tabular-nums;letter-spacing:0.01em;
  }
  .meta b{font-weight:600;color:var(--label-strong)}
</style>
</head>
<body>
  <div class="frame">
    <div class="safe-top"></div>
    <div class="stack">
      <p class="eyebrow" id="eyebrow">&mdash;</p>
      <p class="quote" id="msg">Do the hard things, especially when you don&rsquo;t want to</p>
      <div class="bottom">
        <div class="grid" id="grid" role="img" aria-label="Year progress"></div>
        <span class="meta" id="meta"></span>
      </div>
    </div>
  </div>

<script>
  (function(){
    var params = new URLSearchParams(location.search);

    /* ---- YOUR QUOTE (edit the text in quotes) ---- */
    var MESSAGE = params.get('msg') || "Do the hard things, especially when you don’t want to";

    var accent = params.get('accent');
    if (accent) document.documentElement.style.setProperty('--accent', accent);

    var now;
    var dp = params.get('date');
    if (dp && /^\d{4}-\d{2}-\d{2}$/.test(dp)){
      var p = dp.split('-');
      now = new Date(+p[0], +p[1]-1, +p[2], 12, 0, 0);
    } else {
      now = new Date();
    }

    var year = now.getFullYear();
    var startOfYear = new Date(year, 0, 1);
    var isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
    var totalDays = isLeap ? 366 : 365;
    var dayOfYear = Math.floor((now - startOfYear) / 86400000) + 1;
    var daysLeft = totalDays - dayOfYear;
    var pctDone = Math.round((dayOfYear / totalDays) * 100);

    var dateStr = now.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'});

    document.getElementById('eyebrow').innerHTML =
      '<b>' + daysLeft + '</b> ' + (daysLeft === 1 ? 'day' : 'days') + ' left in ' + year;
    document.getElementById('msg').textContent = MESSAGE;
    document.getElementById('meta').innerHTML =
      '<b>' + pctDone + '%</b> of ' + year + ' · ' + dateStr;

    var grid = document.getElementById('grid');
    grid.setAttribute('aria-label',
      dayOfYear + ' of ' + totalDays + ' days of ' + year + ' elapsed');
    var frag = document.createDocumentFragment();
    for (var i = 1; i <= totalDays; i++){
      var d = document.createElement('span');
      d.className = 'dot' + (i < dayOfYear ? ' past' : i === dayOfYear ? ' today' : '');
      frag.appendChild(d);
    }
    grid.appendChild(frag);
  })();
</script>
</body>
</html>
